    <script>
      // Tema antes de pintar (evita piscar): escolha salva > preferência do sistema
      try {
        var t = localStorage.getItem('atomic_sigtap_tema');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.dataset.tema = t;
      } catch (e) { document.documentElement.dataset.tema = 'claro'; }
    </script>
